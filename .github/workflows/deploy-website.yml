# Uploads website/ to the GoDaddy host serving https://cyberprotocol.io
# whenever it changes on main (or when run by hand from the Actions tab).
#
# Credentials come from repository secrets (Settings -> Secrets and variables -> Actions).
# Either:
#   ACCESS_DETAILS  one secret with lines like
#                     FTP server: ftp.cyberprotocol.io
#                     FTP Username: user@cyberprotocol.io
#                     FTP Password: ...
# or the separate secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD (these win if set).
# FTP_SERVER_DIR is optional; without it the folder holding index.html is detected.

name: Deploy website

on:
  push:
    branches: [main]
    # .github/redeploy is touched by `./publish --redeploy` to re-run without site changes
    paths: ["website/**", ".github/workflows/deploy-website.yml", ".github/redeploy"]
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Resolve FTP settings
        env:
          ACCESS: ${{ secrets.ACCESS_DETAILS }}
          S_SERVER: ${{ secrets.FTP_SERVER }}
          S_USER: ${{ secrets.FTP_USERNAME }}
          S_PASS: ${{ secrets.FTP_PASSWORD }}
          S_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          T=$'\t'
          lines=$(printf '%s\n' "$ACCESS" | tr -d '\r' | grep . || true)

          # 1) "Label: value" / "Label = value" / "Label<TAB>value" lines
          dirlabel="^[^:=$T]*(dir|path|folder|root)[^:=$T]*[:=$T]"
          field() { printf '%s\n' "$lines" | grep -i -v -E "$dirlabel" | grep -i -m1 -E "^[^:=$T]*($1)[^:=$T]*[:=$T]" | sed -E "s/^[^:=$T]*[:=$T][[:space:]]*//; s/[[:space:]]+\$//"; }
          dir_given="${S_DIR:-$(printf '%s\n' "$lines" | grep -i -m1 -E "$dirlabel" | sed -E "s/^[^:=$T]*[:=$T][[:space:]]*//; s/[[:space:]]+\$//")}"
          server="${S_SERVER:-$(field 'server|host')}"
          user="${S_USER:-$(field 'user|login')}"
          pass="${S_PASS:-$(field 'pass|pwd')}"

          # 2) Unlabelled values: tell them apart by shape (user has @, port is a number,
          #    server looks like a domain, the one left over is the password)
          shape=""
          others=()
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            printf '%s\n' "$line" | grep -qiE "$dirlabel" && { shape="$shape [folder setting]"; continue; }
            v="$line"
            case "$line" in *[:=$T]*) v="${line#*[:=$T]}";; esac
            v="$(printf '%s' "$v" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
            if printf '%s' "$v" | grep -qE '^[^[:space:]@]+@[^[:space:]@]+$'; then
              kind="username-like"; [ -z "$user" ] && user="$v"
            elif printf '%s' "$v" | grep -qE '^[0-9]+$'; then
              kind="number"
            elif printf '%s' "$v" | grep -qiE '^(ftps?://)?([a-z0-9-]+\.)+[a-z]{2,}/?$'; then
              kind="domain-like"; [ -z "$server" ] && server="$v"
            else
              kind="other"; others+=("$v")
            fi
            label="${line%%[:=$T]*}"
            if [ "$label" != "$line" ] && printf '%s' "$label" | grep -qE '^[A-Za-z &_./()-]{1,40}$'; then
              shape="$shape [$label -> $kind]"
            else
              shape="$shape [unlabelled $kind]"
            fi
          done <<< "$lines"
          if [ -z "$pass" ] && [ "${#others[@]}" -eq 1 ]; then pass="${others[0]}"; fi

          # Describe ACCESS_DETAILS in the run summary without printing any values
          if [ -z "$lines" ]; then
            echo "::notice::ACCESS_DETAILS is not set or empty (it must be a Repository secret on the Secrets tab)"
          else
            echo "::notice::ACCESS_DETAILS lines:$shape"
          fi

          [ -n "$pass" ] && echo "::add-mask::$pass"
          missing=""
          [ -z "$server" ] && missing="$missing server"
          [ -z "$user" ] && missing="$missing username"
          [ -z "$pass" ] && missing="$missing password"
          if [ -n "$missing" ]; then
            echo "::error::Could not find FTP$missing. Add lines like 'FTP server: ...', 'FTP Username: ...', 'FTP Password: ...' to ACCESS_DETAILS."
            exit 1
          fi

          # GoDaddy hosts often have no ftp.<domain> record; the bare domain serves FTP
          if ! getent hosts "$server" >/dev/null && [ "${server#ftp.}" != "$server" ] && getent hosts "${server#ftp.}" >/dev/null; then
            echo "::notice::$server does not resolve; using ${server#ftp.}"
            server="${server#ftp.}"
          fi

          ls_ftp() { curl -sS -k --ssl-reqd --max-time 30 --list-only --user "$user:$pass" "ftp://$server/$1"; }

          root=$(ls_ftp "" 2>/tmp/ftp-err) || { echo "::error::FTP login to $server failed: $(cat /tmp/ftp-err)"; exit 1; }
          if [ -n "$dir_given" ]; then
            dir="${dir_given#/}"; dir="${dir%/}/"; [ "$dir" = "/" ] && dir="./"
            # only deploy into a folder that already holds the live site
            if ! ls_ftp "${dir#./}" 2>/dev/null | grep -qx 'index.html'; then
              echo "::error::Folder setting '$dir_given' has no index.html for this FTP account, so it is not the live site folder. This account's root contains: $(printf '%s ' $root)"
              exit 1
            fi
          else
            if printf '%s\n' "$root" | grep -qx 'index.html'; then
              dir="./"
            elif printf '%s\n' "$root" | grep -qx 'public_html' && ls_ftp "public_html/" | grep -qx 'index.html'; then
              dir="public_html/"
            else
              echo "::error::Logged in, but no index.html found in the FTP root or public_html/. Set FTP_SERVER_DIR. Root contains: $(printf '%s ' $root)"
              exit 1
            fi
          fi
          echo "Deploying to $server, folder $dir"

          {
            echo "FTP_SERVER=$server"
            echo "FTP_USER=$user"
            echo "FTP_PASS=$pass"
            echo "FTP_DIR=$dir"
          } >> "$GITHUB_ENV"

      - name: Upload to GoDaddy over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_PASS }}
          server-dir: ${{ env.FTP_DIR }}
          local-dir: ./website/
          protocol: ftps
          # GoDaddy's shared-host certificate usually doesn't match the FTP hostname;
          # the connection is still encrypted.
          security: loose
